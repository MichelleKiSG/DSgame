<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Space Shooter Game</title>
</head>
<body>
    <script>
// Space Shooter Game Code for Chrome Extension & Mobile Web

const GAME_WIDTH = 480;
const GAME_HEIGHT = 640;
const PLAYER_SIZE = 32;
const ENEMY_SIZE = 32;
const BULLET_SIZE = 8;
const ENEMY_COLORS = ['#FF5252', '#40C4FF', '#FFD740', '#69F0AE', '#B388FF'];
const LEVEL_TIME = 60 * 1000; // 1 minute
const BORDER_COLOR = '#fff';
const BG_STAR_COUNT = 80;

let canvas, ctx;
let player, bullets, enemies, stars;
let score = 0;
let highScore = 0;
let level = 1;
let gameInterval, enemyInterval, levelTimer, bgInterval;
let isPaused = false;
let isShooting = false;
let gameState = 'menu'; // menu, playing, paused, ended
let lastShot = 0;

function initGameArea() {
    // Create canvas and apply styles
    canvas = document.createElement('canvas');
    canvas.width = GAME_WIDTH;
    canvas.height = GAME_HEIGHT;
    canvas.style.border = `4px solid ${BORDER_COLOR}`;
    canvas.style.background = '#101028';
    canvas.style.display = 'block';
    canvas.style.margin = '24px auto';
    canvas.style.borderRadius = '12px';
    canvas.style.boxShadow = '0 0 24px #222';
    document.body.appendChild(canvas);
    ctx = canvas.getContext('2d');
}

function drawStars() {
    ctx.save();
    for (let star of stars) {
        ctx.globalAlpha = star.alpha;
        ctx.fillStyle = '#fff';
        ctx.beginPath();
        ctx.arc(star.x, star.y, star.radius, 0, 2 * Math.PI);
        ctx.fill();
        star.y += star.speed;
        if (star.y > GAME_HEIGHT) {
            star.y = 0;
            star.x = Math.random() * GAME_WIDTH;
        }
    }
    ctx.globalAlpha = 1;
    ctx.restore();
}

function createStars() {
    stars = [];
    for (let i = 0; i < BG_STAR_COUNT; i++) {
        stars.push({
            x: Math.random() * GAME_WIDTH,
            y: Math.random() * GAME_HEIGHT,
            radius: Math.random() * 1.5 + 0.5,
            speed: Math.random() * 0.7 + 0.2,
            alpha: Math.random() * 0.5 + 0.5
        });
    }
}

function resetGame() {
    player = {
        x: GAME_WIDTH / 2,
        y: GAME_HEIGHT - 60,
        size: PLAYER_SIZE,
        color: '#fff'
    };
    bullets = [];
    enemies = [];
    score = 0;
    level = 1;
    createStars();
    if (localStorage.getItem('spaceShooterHighScore')) {
        highScore = parseInt(localStorage.getItem('spaceShooterHighScore'), 10);
    }
}

function drawPlayer() {
    ctx.save();
    ctx.translate(player.x, player.y);

    // Fighter jet shape
    ctx.beginPath();
    ctx.moveTo(0, -player.size / 2); // Nose
    ctx.lineTo(-player.size / 2.5, player.size / 4); // Left wing
    ctx.lineTo(-player.size / 4, player.size / 2); // Left tail
    ctx.lineTo(0, player.size / 4); // Center bottom
    ctx.lineTo(player.size / 4, player.size / 2); // Right tail
    ctx.lineTo(player.size / 2.5, player.size / 4); // Right wing
    ctx.closePath();
    ctx.fillStyle = '#4FC3F7'; // Jet blue
    ctx.shadowColor = '#fff';
    ctx.shadowBlur = 8;
    ctx.fill();

    // Cockpit
    ctx.beginPath();
    ctx.ellipse(0, -player.size / 6, player.size / 8, player.size / 5, 0, 0, 2 * Math.PI);
    ctx.fillStyle = '#fff';
    ctx.globalAlpha = 0.7;
    ctx.fill();
    ctx.globalAlpha = 1;

    ctx.restore();
}

function drawEnemies() {
    for (let enemy of enemies) {
        ctx.save();
        ctx.translate(enemy.x, enemy.y);

        // Meteor shape (irregular circle with craters)
        ctx.beginPath();
        let r = ENEMY_SIZE / 2;
        let points = 8 + Math.floor(Math.random() * 3);
        for (let i = 0; i < points; i++) {
            let angle = (i / points) * 2 * Math.PI;
            let radius = r * (0.8 + Math.random() * 0.4);
            let x = Math.cos(angle) * radius;
            let y = Math.sin(angle) * radius;
            if (i === 0) ctx.moveTo(x, y);
            else ctx.lineTo(x, y);
        }
        ctx.closePath();
        ctx.fillStyle = '#BCAAA4'; // Meteor brown/gray
        ctx.shadowColor = '#8D6E63';
        ctx.shadowBlur = 8;
        ctx.fill();

        // Craters
        for (let i = 0; i < 3; i++) {
            let craterX = (Math.random() - 0.5) * r * 1.2;
            let craterY = (Math.random() - 0.5) * r * 1.2;
            ctx.beginPath();
            ctx.arc(craterX, craterY, Math.random() * 4 + 2, 0, 2 * Math.PI);
            ctx.fillStyle = '#8D6E63';
            ctx.globalAlpha = 0.5;
            ctx.fill();
            ctx.globalAlpha = 1;
        }

        ctx.restore();
    }
}

function drawBullets() {
    ctx.save();
    ctx.fillStyle = '#fff';
    for (let bullet of bullets) {
        ctx.beginPath();
        ctx.arc(bullet.x, bullet.y, BULLET_SIZE / 2, 0, 2 * Math.PI);
        ctx.fill();
    }
    ctx.restore();
}

function drawScore() {
    ctx.save();
    ctx.font = 'bold 20px Arial';
    ctx.fillStyle = '#FFD740';
    ctx.textAlign = 'right';
    ctx.fillText(`Score: ${score}`, GAME_WIDTH - 16, 32);
    ctx.textAlign = 'left';
    ctx.fillStyle = '#40C4FF';
    ctx.fillText(`High Score: ${highScore}`, 16, 32);
    ctx.restore();
}

function drawLevel() {
    ctx.save();
    ctx.font = 'bold 16px Arial';
    ctx.fillStyle = '#fff';
    ctx.textAlign = 'center';
    ctx.fillText(`Level: ${level}`, GAME_WIDTH / 2, 32);
    ctx.restore();
}

function drawInstructions() {
    ctx.save();
    ctx.font = 'bold 16px Arial';
    ctx.fillStyle = '#fff';
    ctx.textAlign = 'center';
    ctx.fillText('Move: Mouse or Touch | Fire: Click or Tap', GAME_WIDTH / 2, GAME_HEIGHT / 2 - 40);
    ctx.fillText('N: New Game | P: Pause/Resume | Q: Quit', GAME_WIDTH / 2, GAME_HEIGHT / 2 - 10);
    ctx.restore();
}

function drawPause() {
    ctx.save();
    ctx.font = 'bold 32px Arial';
    ctx.fillStyle = '#FFD740';
    ctx.textAlign = 'center';
    ctx.fillText('Paused', GAME_WIDTH / 2, GAME_HEIGHT / 2);
    ctx.restore();
}

function drawGameOver() {
    ctx.save();
    ctx.font = 'bold 32px Arial';
    ctx.fillStyle = '#FF5252';
    ctx.textAlign = 'center';
    ctx.fillText('Game Over', GAME_WIDTH / 2, GAME_HEIGHT / 2 - 20);
    ctx.font = 'bold 20px Arial';
    ctx.fillStyle = '#fff';
    ctx.fillText(`Final Score: ${score}`, GAME_WIDTH / 2, GAME_HEIGHT / 2 + 20);
    ctx.fillText('N: New Game | Q: Quit', GAME_WIDTH / 2, GAME_HEIGHT / 2 + 60);
    ctx.restore();
}

function spawnEnemy() {
    let count = Math.min(2 + Math.floor(level * 0.7), 8);
    for (let i = 0; i < count; i++) {
        let x = Math.random() * (GAME_WIDTH - ENEMY_SIZE) + ENEMY_SIZE / 2;
        let color = ENEMY_COLORS[Math.floor(Math.random() * ENEMY_COLORS.length)];
        let speed = 1 + level * 0.3 + Math.random() * 0.7;
        enemies.push({
            x: x,
            y: -ENEMY_SIZE,
            color: color,
            speed: speed
        });
    }
}

function updateBullets() {
    for (let i = bullets.length - 1; i >= 0; i--) {
        bullets[i].y -= 8;
        if (bullets[i].y < -BULLET_SIZE) {
            bullets.splice(i, 1);
        }
    }
}

function updateEnemies() {
    for (let i = enemies.length - 1; i >= 0; i--) {
        enemies[i].y += enemies[i].speed;
        if (enemies[i].y > GAME_HEIGHT + ENEMY_SIZE) {
            // Enemy passed: decrease score
            score -= 10;
            enemies.splice(i, 1);
            if (score < 0) {
                endGame();
                return; // Stop further processing
            }
        }
    }
}

function checkCollisions() {
    for (let i = enemies.length - 1; i >= 0; i--) {
        let enemy = enemies[i];
        for (let j = bullets.length - 1; j >= 0; j--) {
            let bullet = bullets[j];
            let dx = enemy.x - bullet.x;
            let dy = enemy.y - bullet.y;
            let dist = Math.sqrt(dx * dx + dy * dy);
            if (dist < ENEMY_SIZE / 2 + BULLET_SIZE / 2) {
                // Enemy destroyed
                score += 20;
                enemies.splice(i, 1);
                bullets.splice(j, 1);
                break;
            }
        }
    }
    // Check for game over after all collisions
    if (score < 0 && gameState === 'playing') {
        endGame();
    }
}

function updateHighScore() {
    if (score > highScore) {
        highScore = score;
        localStorage.setItem('spaceShooterHighScore', highScore);
    }
}

function nextLevel() {
    level++;
    clearInterval(enemyInterval);
    enemyInterval = setInterval(spawnEnemy, Math.max(1200 - level * 80, 400));
    if (levelTimer) clearTimeout(levelTimer);
    levelTimer = setTimeout(nextLevel, LEVEL_TIME + level * 2000);
}

function startGame() {
    resetGame();
    gameState = 'playing';
    isPaused = false;
    if (gameInterval) clearInterval(gameInterval);
    if (enemyInterval) clearInterval(enemyInterval);
    if (levelTimer) clearTimeout(levelTimer);
    createStars();
    enemyInterval = setInterval(spawnEnemy, 1200);
    levelTimer = setTimeout(nextLevel, LEVEL_TIME);
    gameInterval = setInterval(gameLoop, 1000 / 60);
}

function pauseGame() {
    if (gameState !== 'playing') return;
    isPaused = !isPaused;
    if (isPaused) {
        clearInterval(gameInterval);
        clearInterval(enemyInterval);
        clearTimeout(levelTimer);
    } else {
        gameInterval = setInterval(gameLoop, 1000 / 60);
        enemyInterval = setInterval(spawnEnemy, Math.max(1200 - level * 80, 400));
        levelTimer = setTimeout(nextLevel, LEVEL_TIME + level * 2000);
    }
}

function endGame() {
    gameState = 'ended';
    clearInterval(gameInterval);
    clearInterval(enemyInterval);
    clearTimeout(levelTimer);
    updateHighScore();
    draw();
}

function shoot() {
    if (gameState !== 'playing' || isPaused) return;
    let now = Date.now();
    if (now - lastShot > 120) { // Fire rate limit
        bullets.push({
            x: player.x,
            y: player.y - PLAYER_SIZE / 2,
        });
        lastShot = now;
    }
}

function gameLoop() {
    if (gameState !== 'playing' || isPaused) return;
    updateBullets();
    updateEnemies();
    checkCollisions();
    updateHighScore();
    draw();
}

function draw() {
    ctx.clearRect(0, 0, GAME_WIDTH, GAME_HEIGHT);
    drawStars();
    drawPlayer();
    drawEnemies();
    drawBullets();
    drawScore();
    drawLevel();
    if (gameState === 'menu') {
        drawInstructions();
    }
    if (isPaused) {
        drawPause();
    }
    if (gameState === 'ended') {
        drawGameOver();
    }
}

function onMouseMove(e) {
    if (!canvas) return;
    let rect = canvas.getBoundingClientRect();
    let mx = e.clientX - rect.left;
    player.x = Math.max(PLAYER_SIZE / 2, Math.min(GAME_WIDTH - PLAYER_SIZE / 2, mx));
}

function onMouseDown(e) {
    if (e.button === 0) {
        isShooting = true;
        shoot();
    }
}

function onMouseUp(e) {
    if (e.button === 0) {
        isShooting = false;
    }
}

function onKeyDown(e) {
    if (e.key === 'n' || e.key === 'N') {
        startGame();
    } else if (e.key === 'p' || e.key === 'P') {
        pauseGame();
    } else if (e.key === 'q' || e.key === 'Q') {
        endGame();
    }
}

// --- Touch event handlers for mobile ---
function onTouchStart(e) {
    e.preventDefault();
    if (e.touches.length > 0) {
        let touch = e.touches[0];
        movePlayerToTouch(touch);
        isShooting = true;
        shoot();
    }
}

function onTouchMove(e) {
    e.preventDefault();
    if (e.touches.length > 0) {
        let touch = e.touches[0];
        movePlayerToTouch(touch);
    }
}

function onTouchEnd(e) {
    e.preventDefault();
    isShooting = false;
}

function movePlayerToTouch(touch) {
    let rect = canvas.getBoundingClientRect();
    let tx = touch.clientX - rect.left;
    player.x = Math.max(PLAYER_SIZE / 2, Math.min(GAME_WIDTH - PLAYER_SIZE / 2, tx));
}

function continuousShootLoop() {
    if (isShooting && gameState === 'playing' && !isPaused) {
        shoot();
    }
    requestAnimationFrame(continuousShootLoop);
}

function setupEventListeners() {
    canvas.addEventListener('mousemove', onMouseMove);
    canvas.addEventListener('mousedown', onMouseDown);
    canvas.addEventListener('mouseup', onMouseUp);
    window.addEventListener('keydown', onKeyDown);

    // Touch events for mobile
    canvas.addEventListener('touchstart', onTouchStart, {passive: false});
    canvas.addEventListener('touchmove', onTouchMove, {passive: false});
    canvas.addEventListener('touchend', onTouchEnd, {passive: false});
}

function showMenu() {
    gameState = 'menu';
    draw();
}

function main() {
    initGameArea();
    resetGame();
    setupEventListeners();
    showMenu();
    continuousShootLoop();
}

main();
// To test the game, the main() function is already called, so the game starts when the file is run.
// If you need a separate test function, you can write it as below.

    </script>
</body>
</html>
